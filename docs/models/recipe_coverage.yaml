# This registry is keyed by an exact Hugging Face checkpoint and task. A
# Supported Models row may cover several checkpoints, but coverage entries must
# be split whenever the example or recipe differs.
version: 1

# The registry is incrementally audited. An absent entry means that coverage
# has not been audited yet; it is not evidence that no recipe exists. Do not
# infer recipe coverage from the implementation or hardware columns in
# supported_models.md.
entries:
  - model: Qwen/Qwen3-Omni-30B-A3B-Instruct
    task: omni-serving
    examples:
      - docs/user_guide/examples/offline_inference/qwen3_omni.md
      - docs/user_guide/examples/online_serving/qwen3_omni.md
    recipe:
      status: repository
      repository_path: recipes/Qwen/Qwen3-Omni.md
      hardware: [nvidia]

  - model: Qwen/Qwen-Image
    task: text-to-image
    examples:
      - docs/user_guide/examples/offline_inference/text_to_image.md
      - docs/user_guide/examples/online_serving/text_to_image.md
    recipe:
      status: published
      published_url: https://recipes.vllm.ai/Qwen/Qwen-Image
      repository_path: recipes/Qwen/Qwen-Image.md
      hardware: [nvidia]

  - model: Qwen/Qwen-Image-2512
    task: text-to-image
    examples:
      - docs/user_guide/examples/offline_inference/text_to_image.md
      - docs/user_guide/examples/online_serving/text_to_image.md
    recipe:
      status: repository
      repository_path: recipes/Qwen/Qwen-Image-2512.md
      hardware: [nvidia]

  - model: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    task: text-to-speech
    examples:
      - docs/user_guide/examples/offline_inference/text_to_speech.md
      - docs/user_guide/examples/online_serving/text_to_speech.md
    recipe:
      status: published
      published_url: https://recipes.vllm.ai/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      repository_path: recipes/Qwen/Qwen3-TTS.md
      hardware: [nvidia]

  - model: bosonai/higgs-audio-v3-tts-4b
    task: text-to-speech
    examples:
      - docs/user_guide/examples/online_serving/text_to_speech.md
    recipe:
      status: published
      published_url: https://recipes.vllm.ai/bosonai/higgs-audio-v3-tts-4b
      repository_path: recipes/BosonAI/Higgs-Audio-V3-TTS.md
      hardware: [nvidia]

  - model: MiniMaxAI/MiniMax-H3
    task: video-audio-generation
    examples: []
    recipe:
      status: published
      published_url: https://recipes.vllm.ai/MiniMaxAI/MiniMax-H3
      repository_path: recipes/MiniMaxAI/MiniMax-H3.md
      hardware: [nvidia, amd]
