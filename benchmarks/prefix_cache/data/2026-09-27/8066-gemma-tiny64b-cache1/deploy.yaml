stages:
- async_scheduling: false
  devices: 0,1
  enable_prefix_caching: true
  enforce_eager: true
  engine_extras:
    attention_config:
      backend: FLASHINFER
    block_size: 16
    decode_context_parallel_size: 2
  gpu_memory_utilization: 0.3
  max_model_len: 2048
  max_num_batched_tokens: 1024
  max_num_seqs: 1
  stage_id: 0
  tensor_parallel_size: 2
